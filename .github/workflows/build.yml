name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK manually
        run: |
          CMDTOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -s -o /tmp/cmdtools.zip "$CMDTOOLS_URL"
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
          sdkmanager --sdk_root=$HOME/android-sdk "platforms;android-33" "build-tools;33.0.2" "platform-tools"
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log || true

      - name: Save result & Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find . -name "app-debug.apk" 2>/dev/null | head -1)
          {
            echo "# Build Result - $(date)"
            [ -n "$APK" ] && echo "## ✅ SUCCESS | $(du -h $APK | cut -f1)" || { echo "## ❌ FAILED"; grep -E "^e:|error:|FAILED" build.log | head -20; }
          } > BUILD_RESULT.md
          git config user.email "ci@build.com"
          git config user.name "CI"
          git add BUILD_RESULT.md
          git diff --staged --quiet || git commit -m "ci: build result [skip ci]"
          git push

          [ -z "$APK" ] && exit 0
          TAG="v1.0-latest"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          sleep 2
          gh release create "$TAG" \
            --title "גרסה עדכנית" \
            --notes "APK עדכני — $(date '+%d/%m/%Y %H:%M')" \
            "$APK#app-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: "**/*.apk"
          if-no-files-found: warn
          retention-days: 30
