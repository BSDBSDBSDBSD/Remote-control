name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;33.0.2"
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log || true
      - name: Save result
        run: |
          APK=$(find . -name "app-debug.apk" 2>/dev/null | head -1)
          {
            echo "# Build Result - $(date)"
            [ -n "$APK" ] && echo "## ✅ SUCCESS" || echo "## ❌ FAILED"
          } > BUILD_RESULT.md
          git config user.email "ci@build.com"
          git config user.name "CI"
          git add BUILD_RESULT.md
          git diff --staged --quiet || git commit -m "ci: build result [skip ci]"
          git push
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find . -name "app-debug.apk" | head -1)
          [ -z "$APK" ] && cat build.log | tail -30 && exit 1
          TAG="v1.0-latest"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          sleep 3
          gh release create "$TAG" \
            --title "גרסה עדכנית" \
            --notes "APK עדכני — בנוי $(date '+%d/%m/%Y %H:%M')" \
            "$APK#app-debug.apk"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: "**/*.apk"
          if-no-files-found: warn
          retention-days: 30
