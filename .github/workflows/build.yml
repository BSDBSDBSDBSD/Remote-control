name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;33.0.2"
          yes | sdkmanager --licenses || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show project structure
        run: |
          echo "=== Root ===" && ls -la
          echo "=== App ===" && ls -la app/
          echo "=== Gradle wrapper ===" && ls -la gradle/wrapper/
          echo "=== gradlew first line ===" && head -3 gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      - name: Find APK and show errors
        run: |
          echo "=== APK files found ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo ""
          echo "=== Last 80 lines of build log ==="
          tail -80 build.log || true
          echo ""
          echo "=== Errors ==="
          grep -E "^e:|error:|FAILED|Unresolved|Could not" build.log | head -30 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            **/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
