name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;33.0.2"
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log || true
      - name: Commit results
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          {
            echo "# Build Result"
            echo "Date: $(date)"
            if [ -n "$APK" ]; then
              echo "## SUCCESS - $APK"
            else
              echo "## FAILED"
              echo ""
              echo "### Kotlin errors:"
              echo '```'
              grep -E "^e: |error:|\.kt:[0-9]" build.log | head -50 || echo "no kotlin errors found"
              echo '```'
              echo ""
              echo "### Task errors:"
              echo '```'
              grep -A 3 "FAILED\|Caused by:" build.log | head -40
              echo '```'
            fi
          } > BUILD_RESULT.md
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add BUILD_RESULT.md
          git diff --staged --quiet || git commit -m "ci: build result [skip ci]"
          git push
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/*.apk"
          if-no-files-found: warn
          retention-days: 30
