name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK via apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip
          # Android SDK כבר מותקן בחלקו ב-ubuntu-latest
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          ls /usr/local/lib/android/sdk/ 2>/dev/null || echo "SDK not pre-installed"
          # שימוש ב-sdkmanager הקיים
          SDKMANAGER=$(find /usr/local/lib/android -name "sdkmanager" 2>/dev/null | head -1)
          echo "sdkmanager found: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2" || true
          fi
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || true

      - name: Release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find . -name "app-debug.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found. Last 40 lines:"
            tail -40 build.log
            exit 1
          fi
          echo "✅ APK found: $APK"
          TAG="v1.0-latest"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          sleep 3
          gh release create "$TAG" \
            --title "גרסה עדכנית" \
            --notes "$(date '+%d/%m/%Y %H:%M')" \
            "$APK#app-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: "**/*.apk"
          if-no-files-found: warn
          retention-days: 30
