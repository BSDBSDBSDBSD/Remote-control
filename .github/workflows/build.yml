name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -s -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
          sdkmanager --sdk_root=$HOME/android-sdk "platforms;android-33" "build-tools;33.0.2" "platform-tools"
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log || true

      - name: Release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find . -name "app-debug.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && echo "❌ APK not found" && tail -30 build.log && exit 1
          echo "✅ APK: $APK ($(du -h $APK | cut -f1))"
          TAG="v1.0-latest"
          # מחיקת release ישן אם קיים
          REL_ID=$(gh release view "$TAG" --json id -q '.id' 2>/dev/null || echo "")
          [ -n "$REL_ID" ] && gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          sleep 5
          gh release create "$TAG" \
            --title "גרסה עדכנית" \
            --notes "$(date '+%d/%m/%Y %H:%M')" \
            "$APK#app-debug.apk"
          echo "✅ Release created"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: "**/*.apk"
          if-no-files-found: warn
          retention-days: 30
